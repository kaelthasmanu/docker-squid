
services:
  chrome:
    image: lscr.io/linuxserver/chrome:latest
    container_name: chrome

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--proxy-server=http://squid:3128 --disable-quic

    volumes:
      - ./chrome_config:/config

    ports:
      - "3000:3000"
      - "3001:3001"

    shm_size: "1gb"

    networks:
      - proxy_internal
      - proxy_access

    #depends_on:
      #- squid

    restart: unless-stopped

