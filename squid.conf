http_port 3128

# Resolver DNS usado por el Squid hijo. Docker escucha aquí y también
# reenvía las consultas externas a los DNS configurados en el host.
dns_nameservers 192.168.97.1

# Este Squid es el proxy de entrada. Todas las solicitudes se envían al
# proxy padre dentro de la red de Docker. Se usa la IP fija para no depender
# de que el DNS configurado para los destinos resuelva nombres de Compose.
cache_peer 172.30.0.3 parent 3128 0 no-query default
never_direct allow all

cache_effective_user proxy
cache_effective_group proxy

# Esta imagen instala las páginas base en templates, sin carpetas por idioma.
error_directory /usr/share/squid/errors/templates

cache_mem 64 MB
cache_dir ufs /var/spool/squid 100 16 256
visible_hostname squid-proxy

access_log /var/log/squid/access.log 
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid

# ACLs específicas
acl localhost src 127.0.0.1/32 ::1
acl red_local1 src 10.34.152.0/22
acl red_docker src 172.17.0.0/16

# ACL de destino lenta: obliga al hijo a resolver el hostname solicitado
# antes de autorizar la petición y enviarla al proxy padre.
acl dns_destino_v4 dst 0.0.0.0/1 128.0.0.0/1
acl dns_destino_v6 dst ::/1 8000::/1
acl dns_destino any-of dns_destino_v4 dns_destino_v6

# ACL para todo el resto del tráfico
acl otras_redes src all

# Delay Pools
delay_pools 3

# Pool 1: Red local1
delay_class 1 2
delay_access 1 allow red_local1
delay_parameters 1 3000000/3000000 750000/750000

# Pool 2: Red docker
delay_class 2 2
delay_access 2 allow red_docker
delay_parameters 2 1500000/1500000 384000/384000

# Pool 3: Otras redes
delay_class 3 2
delay_access 3 allow otras_redes
delay_parameters 3 750000/750000 192000/192000

# Reglas de acceso
http_access allow dns_destino localhost
http_access allow dns_destino red_local1
http_access allow dns_destino red_docker
http_access allow dns_destino otras_redes
http_access deny all
