# ============================================
# PUERTO Y CONFIGURACIÓN GENERAL
# ============================================
http_port 3128

cache_effective_user proxy
cache_effective_group proxy

cache_mem 64 MB
cache_dir ufs /var/spool/squid 100 16 256
visible_hostname inutil.cu

# ============================================
# AUTENTICACIÓN KERBEROS (ACTUALIZADO)
# ============================================
# Usa la ruta CORRECTA del helper y el keytab
auth_param negotiate program /usr/lib/squid/negotiate_kerberos_auth -k /etc/squid/HTTP.keytab -s HTTP/inutil.cu@INUTIL.CU
auth_param negotiate children 10 startup=5 idle=3
auth_param negotiate keep_alive on

# ============================================
# LOGS
# ============================================
access_log /var/log/squid/access.log 
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid

# ============================================
# ACLs (Listas de Control de Acceso)
# ============================================
# ACL para usuarios autenticados (DEBE IR PRIMERO)
acl auth proxy_auth REQUIRED

# ACLs para redes
acl localhost src 127.0.0.1/32 ::1
acl red_local1 src 10.34.152.0/22
acl red_docker src 172.17.0.0/16
acl otras_redes src 0.0.0.0/0

# ACL para puertos seguros (opcional, mejora seguridad)
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 21          # ftp
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # puertos no registrados
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# ============================================
# DELAY POOLS (Control de Ancho de Banda)
# ============================================
delay_pools 3

# Pool 1: Red local1
delay_class 1 2
delay_access 1 allow red_local1
delay_parameters 1 3000000/3000000 750000/750000

# Pool 2: Red docker
delay_class 2 2
delay_access 2 allow red_docker
delay_parameters 2 1500000/1500000 384000/384000

# Pool 3: Otras redes
delay_class 3 2
delay_access 3 allow otras_redes
delay_parameters 3 750000/750000 192000/192000

# ============================================
# REGLAS DE ACCESO (ORDEN CRÍTICO)
# ============================================
# 1. Siempre permitir localhost (sin autenticación)
http_access allow localhost

# 2. Permitir usuarios autenticados (reemplaza las reglas por IP)
http_access allow auth

# 3. NEGAR todo lo demás
http_access deny all

# ============================================
# REGLAS DE SEGURIDAD (Evita abusos)
# ============================================
# Denegar peticiones a puertos no seguros
http_access deny !Safe_ports

# Denegar CONNECT a puertos no SSL
http_access deny CONNECT !SSL_ports

# ============================================
# CONFIGURACIÓN DE CACHE (MEJORADA)
# ============================================
# No cachear respuestas de autenticación
cache allow auth
cache deny all

# Aumentar el tiempo de vida de objetos en caché
maximum_object_size_in_memory 512 KB
memory_replacement_policy heap GDSF
cache_replacement_policy heap LFUDA

# ============================================
# CONFIGURACIÓN DE REINICIO (RECOMENDADO)
# ============================================
# Evita que Squid se bloquee al reconectarse
shutdown_lifetime 5 seconds
