#include /etc/squid/squid.d/00_ports.conf
#include /etc/squid/squid.d/10_misc.conf
#include /etc/squid/squid.d/30_cache.conf
#include /etc/squid/squid.d/60_logs.conf
#include /etc/squid/squid.d/90_includes.conf
#include /etc/squid/squid.d/100_acls.conf
#include /etc/squid/squid.d/110_delay_pools.conf
#include /etc/squid/squid.d/120_http_access.conf
#include /etc/squid/squid.d/55_ssl_bump.conf

http_port 3128

cache_effective_user proxy
cache_effective_group proxy

max_filedescriptors 65536

cache_mem 64 MB
cache_dir ufs /var/spool/squid 100 16 256
visible_hostname squid-balanceador

access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid.pid

# ============================================================
# BALANCEO DE CARGA - Round Robin
# ============================================================
icp_port 0
cache_peer 192.168.100.11 parent 3128 0 round-robin name=backend1
cache_peer 192.168.100.12 parent 3128 0 round-robin name=backend2
cache_peer 192.168.100.13 parent 3128 0 round-robin name=backend3
never_direct allow all

# ACLs específicas
acl localhost src 127.0.0.1/32 ::1
acl red_local1 src 10.34.152.0/22
acl red_docker src 172.17.0.0/16
acl casa src 192.168.0.0/15
# ACL para todo el resto del tráfico

# Delay Pools
delay_pools 2

# Pool 1: Red local1
delay_class 1 2
delay_access 1 allow red_local1
delay_parameters 1 3000000/3000000 750000/750000

# Pool 2: Red docker
delay_class 2 2
delay_access 2 allow red_docker
delay_parameters 2 1500000/1500000 384000/384000

# Reglas de acceso
http_access allow localhost
http_access allow red_local1
http_access allow red_docker
http_access allow casa
http_access deny all
